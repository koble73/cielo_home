# Service ID
sync_ac_state:
  # Service name as shown in UI
  name: Sync AC State
  # Description of the service
  description: Sync AC State
  target:
  fields:
    power:
      name: Power
      description: Power setting
      required: true
      advanced: false
      example: true
      default: true
      selector:
        boolean:
    temp:
      name: Temperature
      description: Temperature setting
      required: false
      advanced: false
      example: 25
      default: 25
      selector:
        number:
          min: 0
          max: 100
    mode:
      name: HVAC Mode
      description: HVAC Mode setting
      required: false
      advanced: false
      example: ""
      default: "auto"
      selector:
        select:
          options:
            - "heat"
            - "cool"
            - "auto"
            - "dry"
            - "fan"
    fan_speed:
      name: Fan Speed
      description: Fan Speed setting
      required: false
      advanced: false
      example: "auto"
      default: "auto"
      selector:
        select:
          options:
            - "auto"
            - "low"
            - "medium"
            - "high"
            - "super_high"
            - "ultra_high"
    swing:
      name: Fan Swing
      description: Fan Swing setting
      required: false
      advanced: false
      example: "auto"
      default: "auto"
      selector:
        select:
          options:
            - "auto"
            - "adjust"
            - "auto/stop"
            - "pos1"
            - "pos2"
            - "pos3"
            - "pos4"
            - "pos5"
            - "pos6"
    preset:
      name: Preset mode
      description: Preset mode setting
      required: false
      advanced: false
      example: "none"
      default: "none"
      selector:
        select:
          options:
            - "none"
            - "Turbo"

# Service ID
set_temperature_offset:
  name: Set Temperature Offset
  description: Set the temperature calibration offset (delta) applied to the device's room temperature reading. Per-call magnitude is capped at 8 by the protocol; reaching the extremes of the supported range may require multiple calls.
  target:
  fields:
    offset:
      name: Offset
      description: Calibration offset to apply, in the device's temperature unit.
      required: true
      example: 2
      default: 0
      selector:
        number:
          min: -15
          max: 15
          step: 1
